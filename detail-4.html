<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新・インスタ運用の教科書｜あおあしのBrain教材ナビ</title>
<meta name="description" content="新・インスタ運用の教科書の販売終了のお知らせ。">
<link rel="icon" href="aoashi-icon-goma.png">
<style>
  :root {
    --paper: #f4ecd9;
    --card: #fffdf4;
    --ink: #2e2417;
    --muted: #6b5b3e;
    --line: #c9b98f;
    --accent: #8f271e;
    --mincho: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.8 system-ui, sans-serif; }
  a { color: var(--accent); text-underline-offset: .2em; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .site-header { border-bottom: 1px solid var(--line); }
  .header-inner { display: flex; justify-content: space-between; gap: 1rem; align-items: center; }
  .header-inner a { font-weight: 700; }
  .wrap { width: min(100% - 2.5rem, 68rem); margin-inline: auto; }
  .detail .wrap { max-width: 43rem; }
  h1, h2, h3, h4 { font-family: var(--mincho); line-height: 1.45; overflow-wrap: anywhere; }
  h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin: .35em 0 .5em; }
  h2 { font-size: clamp(1.4rem, 3vw, 2rem); }
  h3 { font-size: clamp(1.18rem, 2.5vw, 1.55rem); }
  h4 { font-size: 1.15rem; margin: 0; }
  .connection, .head { padding-block: clamp(2rem, 6vw, 4rem) 1.5rem; }
  .connection p { max-width: 44rem; }
  .portrait { border-radius: 50%; border: 1px solid var(--line); display: block; }
  .shelf, .blk { padding-block: 1rem; border-top: 1px solid var(--line); }
  .shelf > h2 { color: var(--accent); }
  .scene { margin-block: 2rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 1rem; }
  .card { display: flex; flex-direction: column; min-width: 0; background: var(--card); border: 1px solid var(--line); padding: clamp(1rem, 3vw, 1.6rem); }
  .card .meta { margin-top: auto; }
  .meta, .disclosure, .caution, .site-footer { color: var(--muted); font-size: .875rem; }
  .meta { margin-bottom: .85rem; }
  .caution { border-left: 2px solid var(--line); padding-left: .75rem; margin-top: 0; }
  .buy { align-self: flex-start; display: inline-block; background: var(--accent); color: var(--card); padding: .5rem 1rem; font-weight: 700; border-radius: .2rem; text-decoration: none; }
  .buy:hover { text-decoration: underline; }
  .site-footer { border-top: 1px solid var(--line); padding-block: 1rem 2rem; }
  .site-footer strong { color: var(--ink); }
</style>
</head>

</header>
<main class="wrap" data-detail="4" data-product-id="4">

    <h1 data-field="title">新・インスタ運用の教科書</h1>
  </div>
  <section class="blk">
    <h2>【販売終了】</h2>

    <p><a href="index.html#list">販売中の教材を見る</a></p>
  </section>
<footer class="site-footer">

</html>
