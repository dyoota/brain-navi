<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ストーリーズの教科書｜あおあしのBrain教材ナビ</title>
<meta name="description" content="ストーリーズの教科書の販売終了のお知らせ。">
<link rel="icon" href="aoashi-icon-goma.png">
<style>
  :root {
    color-scheme: dark;
    --paper: #08090a;
    --card: #0f1011;
    --raised: #141516;
    --ink: #f7f8f8;
    --body: #d0d6e0;
    --muted: #8a8f98;
    --line: #23252a;
    --edge: #ffffff0d;
    --edge-strong: #ffffff14;
    --accent: #828fff;
    --button: #e5e5e6;
    --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--body);
    font: 400 16px/1.65 system-ui, "Noto Sans CJK JP", sans-serif;
    overflow-wrap: anywhere;
  }

  a { color: var(--accent); text-underline-offset: .2em; }
  a:hover { color: var(--ink); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

  .wrap { width: min(100% - 2.5rem, 70rem); margin-inline: auto; }
  .site-header { border-bottom: 1px solid var(--edge-strong); }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px 24px;
    min-height: 72px;
    padding-block: 8px;
  }
  .header-inner p { margin: 0; }
  .header-inner a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }
  .header-inner a:hover { color: var(--accent); }

  h1, h2, h3, h4 {
    margin: 0;
    color: var(--ink);
    font-weight: 600;
    line-height: 1.28;
    letter-spacing: -.022em;
  }
  h1 { font-size: clamp(2rem, 5.25vw, 4rem); }
  h2 { font-size: clamp(1.65rem, 3.4vw, 3rem); }
  h3 { font-size: clamp(1rem, 1.7vw, 1.25rem); }
  h4 { font-size: 1.0625rem; }

  .meta, .disclosure {
    color: var(--muted);
    font: 400 12px/1.6 var(--mono);
    text-transform: uppercase;
  }
  .buy {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 8px 16px;
    border-radius: 9999px;
    background: var(--button);
    color: var(--paper);
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    transition: background-color 160ms ease;
  }
  .buy:hover { background-color: #fff; color: var(--paper); }

  .site-footer {
    border-top: 1px solid var(--line);
    padding-block: 24px 48px;
    color: var(--muted);
    font-size: 13px;
  }
  .site-footer p { margin: 0 0 8px; }
  .site-footer strong { color: var(--ink); }

  @media (max-width: 480px) {
    .header-inner { flex-wrap: wrap; gap: 0 12px; min-height: 64px; }
  }

  .detail main.wrap { max-width: 48rem; }
  .detail .header-inner .meta a { font: 500 13px/1.6 system-ui, sans-serif; }
  .head { padding-block: clamp(40px, 7vw, 96px) clamp(32px, 5vw, 64px); }
  .head .disclosure { margin: 0 0 16px; }
  .head h1 { font-size: clamp(2rem, 4.5vw, 3.5rem); }

  .blk {
    padding: clamp(16px, 4vw, 32px);
    border: 1px solid var(--edge);
    border-radius: 8px;
    background: var(--card);
  }
  .blk + .blk { margin-top: 16px; }
  .blk h2 { font-size: clamp(1.25rem, 2.3vw, 1.5rem); }
  .blk p { margin: 16px 0 0; }
  .blk .meta { border-top: 1px solid var(--edge-strong); padding-top: 16px; }
  .detail .site-footer { margin-top: 40px; }
</style>
</head>
<body class="detail">
<header class="site-header">
  <div class="wrap header-inner">
    <p><a href="index.html">あおあしのBrain教材ナビ</a></p>
    <p class="meta"><a href="index.html#list">一覧へ戻る</a></p>
  </div>
</header>
<main class="wrap" data-detail="1" data-product-id="1">
  <div class="head">
    
    <h1 data-field="title">ストーリーズの教科書</h1>
  </div>
  <section class="blk">
    <h2>【販売終了】</h2>
    <p>Brainの販売ページで売り切れ（残り0部）を確認したため、この教材は棚から外しました。</p>
    <p><a href="index.html#list">販売中の教材を見る</a></p>
  </section>
<footer class="site-footer">
  <p><strong>俺の紹介で売れた実績は、まだ0件だ。</strong></p>
  <p>運営：あおあし｜Brain公式サイトではありません｜収益を保証するものではありません</p>
</footer>
</main>
</body>
</html>
